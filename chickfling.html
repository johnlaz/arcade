<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0520">
<title>🐥 Chick Fling!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&amp;family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0520; --gold:#FFD700; --pink:#FF6B9D; --cyan:#00E5FF; --purple:#C77DFF; --green:#69FF47; --orange:#FF9500;
  --font-title:'Fredoka One','Baloo 2',ui-rounded,system-ui,cursive; --font-body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:var(--bg);color:#fff;font-family:var(--font-body);overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#hud{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(#1a0a36,#120628);border-bottom:2px solid rgba(255,255,255,.1);z-index:5}
.hbtn{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#d9ccff;font-size:1.15rem;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;font-family:var(--font-title);flex:none}
.hbtn:active{background:rgba(255,255,255,.25);transform:scale(.94)}
#lvl{flex:1;min-width:0;font-family:var(--font-title);font-size:clamp(.9rem,3.8vw,1.15rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
#lvl small{display:block;font-family:var(--font-body);font-weight:800;font-size:.62rem;color:rgba(199,184,255,.7)}
#score{font-family:var(--font-title);font-size:clamp(1rem,4.4vw,1.3rem);color:var(--gold);min-width:64px;text-align:right;text-shadow:0 0 12px rgba(255,215,0,.35)}
#stage{flex:1;position:relative;min-height:0;background:#8fd8ff}
#cv{position:absolute;left:0;top:0;touch-action:none;display:block}

.overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(13,5,32,.82);backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.panel{width:100%;max-width:420px;max-height:100%;overflow:auto;text-align:center;padding:18px 16px 16px;border-radius:26px;background:linear-gradient(160deg,#2a0f55,#17093a);border:2px solid rgba(255,255,255,.16);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.logo{font-family:var(--font-title);font-size:clamp(2rem,10vw,3rem);line-height:1;letter-spacing:.01em;color:#ffe45e;-webkit-text-stroke:2px #7a2cc9;paint-order:stroke fill;text-shadow:0 4px 0 #7a2cc9,0 8px 18px rgba(0,0,0,.4)}
.logo span{display:block;color:#ff8fc4;font-size:.78em}
.tag{margin:10px 0 14px;font-weight:800;font-size:.85rem;color:rgba(199,184,255,.85)}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.lbtn{position:relative;padding:10px 4px 8px;border-radius:18px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;font-family:var(--font-title);cursor:pointer}
.lbtn:active{transform:scale(.94);border-color:var(--gold)}
.lbtn b{display:block;font-size:1.6rem;line-height:1.1;color:var(--gold)}
.lbtn i{display:block;font-style:normal;font-size:.62rem;font-family:var(--font-body);font-weight:800;color:rgba(199,184,255,.75);min-height:1.5em;line-height:1.2}
.lbtn em{display:block;font-style:normal;font-size:.8rem;letter-spacing:.08em;color:rgba(255,255,255,.22)}
.lbtn em.on{color:var(--gold)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{font-family:var(--font-title);font-size:1.05rem;padding:11px 20px;border-radius:30px;border:none;color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff6b9d,#c77dff);box-shadow:0 5px 0 rgba(0,0,0,.3)}
.btn.alt{background:rgba(255,255,255,.14);box-shadow:none;border:1.5px solid rgba(255,255,255,.2)}
.btn:active{transform:translateY(2px) scale(.97)}
.big{font-family:var(--font-title);font-size:2rem;color:var(--gold);text-shadow:0 3px 0 #7a2cc9}
.stars{font-size:2.6rem;letter-spacing:.1em;margin:6px 0 2px;color:rgba(255,255,255,.2)}
.stars .on{color:var(--gold);filter:drop-shadow(0 0 10px rgba(255,215,0,.6));display:inline-block;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.stars .on:nth-child(2){animation-delay:.18s}.stars .on:nth-child(3){animation-delay:.36s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.sc{font-family:var(--font-title);font-size:1.2rem;color:#fff}
.ver{margin-top:12px;font-size:.6rem;font-weight:800;color:rgba(255,255,255,.25)}
@media (prefers-reduced-motion:reduce){.stars .on{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <a class="hbtn" href="index.html" aria-label="Back to arcade">←</a>
    <div id="lvl">Chick Fling!<small>Pick a level</small></div>
    <div id="score">0</div>
    <button class="hbtn" id="snd" aria-label="Sound">🔊</button>
    <button class="hbtn" id="rst" aria-label="Restart level">↻</button>
    <button class="hbtn" id="menu" aria-label="Levels">☰</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay show" id="ovMenu">
      <div class="panel">
        <div class="logo">CHICK<span>FLING!</span></div>
        <div class="tag">Sling the chicks &amp; pop all the slimes!</div>
        <div class="lgrid" id="lgrid"></div>
        <div class="row"><a class="btn alt" href="index.html" style="text-decoration:none">🏠 Arcade</a></div>
        <div class="ver">v1.0</div>
      </div>
    </div>
    <div class="overlay" id="ovEnd">
      <div class="panel">
        <div class="big" id="endTitle">Level Clear!</div>
        <div class="stars" id="endStars"></div>
        <div class="sc" id="endScore"></div>
        <div class="row" id="endBtns"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ CHICK FLING CORE (DOM-free) ============
   Physics coordinates: x right, y DOWN, ground surface at y = 0.
   Things above the ground have NEGATIVE y. Level specs use "height above ground".
*/
const WORLD_W = 500;
const SLING = { x: 70, y: -112 };          // sling anchor (physics coords)
const MAX_PULL = 80;
const POWER = 0.18;                        // launch velocity per pixel of pull (px/step)
const GRAV_STEP = 0.001 * 16.6667 * 16.6667; // matter gravity per step at scale .001
const STEP_MS = 1000 / 60;
const CHICK_R = 14;
const DMG_K = 2.3;

const MATS = {
  wood:  { density: 0.0016, hp: 62,  friction: 0.8, rest: 0.05 },
  ice:   { density: 0.0010, hp: 30,  friction: 0.2, rest: 0.05 },
  stone: { density: 0.0042, hp: 170, friction: 0.9, rest: 0.02 },
  slime: { density: 0.0016, hp: 22,  friction: 0.6, rest: 0.1  }
};

/* ---------- level helpers (cy = height of block centre above ground) ---------- */
const B = (m, cx, cy, w, h, a) => ({ k: m, cx, cy, w, h, a: a || 0 });
const S = (cx, cy, r) => ({ k: 'slime', cx, cy, r: r || 17 });
// a little hut: two posts + roof, returns items and roof top height
function hut(cx, w, h, m, roofM) {
  const pw = 14, rh = 14;
  return [
    B(m, cx - w / 2 + pw / 2, h / 2, pw, h),
    B(m, cx + w / 2 - pw / 2, h / 2, pw, h),
    B(roofM || m, cx, h + rh / 2, w + 12, rh)
  ];
}

const LEVELS = [
  { name: 'Sleepy Hut', chicks: ['y', 'y', 'y', 'y'], items: [
      ...hut(480, 78, 60, 'wood'), S(480, 18) ] },

  { name: 'Twin Huts', chicks: ['y', 'y', 'y', 'y', 'y'], items: [
      ...hut(430, 76, 58, 'wood'), S(430, 18),
      ...hut(545, 76, 58, 'wood'), S(545, 18) ] },

  { name: 'Roof Top', chicks: ['y', 'y', 'y', 'y'], items: [
      ...hut(470, 90, 62, 'wood'), S(470, 18),
      S(470, 62 + 14 + 17) ] },

  { name: 'Ice Palace', chicks: ['y', 'y', 'b', 'y'], items: [
      ...hut(430, 80, 60, 'ice'), S(430, 18),
      B('ice', 430, 62 + 14 + 25, 40, 50),
      ...hut(545, 80, 60, 'ice'), S(545, 18),
      S(545, 62 + 14 + 17) ] },

  { name: 'Tall Tower', chicks: ['y', 'y', 'y', 'b'], items: [
      B('wood', 500, 20, 56, 40), B('wood', 500, 60, 56, 40), B('wood', 500, 100, 56, 40),
      B('wood', 500, 130, 70, 14), S(500, 130 + 7 + 17),
      ...hut(400, 70, 50, 'wood'), S(400, 18) ] },

  { name: 'Stone Gate', chicks: ['y', 'y', 'b', 'p', 'y'], items: [
      B('stone', 455, 35, 18, 70), B('stone', 535, 35, 18, 70),
      B('wood', 495, 70 + 8, 110, 16), S(495, 18),
      S(495, 70 + 16 + 17),
      B('wood', 370, 20, 40, 40), S(370, 40 + 17) ] },

  { name: 'Pyramid Pop', chicks: ['y', 'y', 'y', 'b', 'p'], items: [
      B('wood', 440, 20, 40, 40), B('wood', 482, 20, 40, 40), B('wood', 524, 20, 40, 40), B('wood', 566, 20, 40, 40),
      B('wood', 461, 60, 40, 40), B('wood', 503, 60, 40, 40), B('wood', 545, 60, 40, 40),
      B('wood', 482, 100, 40, 40), B('wood', 524, 100, 40, 40),
      S(503, 120 + 17), S(420, 17 + 0), S(586, 17) ] },

  { name: 'Wobbly Bridge', chicks: ['y', 'y', 'b', 'p', 'y'], items: [
      B('wood', 400, 45, 18, 90), B('wood', 580, 45, 18, 90),
      B('wood', 490, 90 + 7, 210, 14),
      S(450, 90 + 14 + 17), S(530, 90 + 14 + 17),
      B('ice', 490, 20, 26, 40), S(490, 40 + 17) ] },

  { name: 'Fort Fluff', chicks: ['y', 'y', 'b', 'p', 'y', 'p'], items: [
      B('stone', 380, 30, 18, 60), B('wood', 380, 60 + 7, 50, 14), S(380, 60 + 14 + 17),
      ...hut(480, 90, 62, 'wood'), S(480, 18),
      B('ice', 480, 62 + 14 + 21, 44, 42), S(480, 62 + 14 + 42 + 17),
      B('stone', 580, 40, 18, 80), B('wood', 580, 80 + 7, 50, 14), S(580, 80 + 14 + 17),
      S(535, 17) ] }
];

// compact the layout so everything draws larger on phones
LEVELS.forEach(L => L.items.forEach(it => { it.cx -= 125; }));

/* ---------- game factory ---------- */
function createGame(M) {
  const { Engine, Composite, Bodies, Body, Events, Sleeping } = M;
  const engine = Engine.create({ enableSleeping: true });
  engine.gravity.y = 1;
  engine.positionIterations = 10;
  engine.velocityIterations = 8;
  const world = engine.world;

  const G = {
    M, engine, world,
    level: 0, phase: 'idle', armed: false,
    items: [],            // blocks & slimes (bodies with plugin.kind)
    chick: null, queue: [], chickKind: 'y', used: 0, total: 0,
    abilityUsed: false, flyT: 0, calmT: 0, settleT: 0,
    score: 0, fx: [], result: null, tick: 0
  };

  const ground = Bodies.rectangle(1000, 60, 6000, 120, { isStatic: true, friction: 1, restitution: 0.05, label: 'ground' });
  ground.plugin.kind = 'ground';
  Composite.add(world, ground);

  function wakeAll() { for (const b of G.items) Sleeping.set(b, false); }

  function addItem(it) {
    let b;
    if (it.k === 'slime') {
      const m = MATS.slime;
      b = Bodies.circle(it.cx, -it.cy - 1, it.r, { density: m.density, friction: m.friction, restitution: m.rest, frictionStatic: 1 });
      b.plugin.kind = 'slime'; b.plugin.r = it.r;
    } else {
      const m = MATS[it.k];
      b = Bodies.rectangle(it.cx, -it.cy - 0.5, it.w, it.h, { density: m.density, friction: m.friction, restitution: m.rest, frictionStatic: 1.2, slop: 0.04 });
      if (it.a) Body.setAngle(b, it.a);
      b.plugin.kind = 'block'; b.plugin.mat = it.k; b.plugin.w = it.w; b.plugin.h = it.h;
    }
    b.plugin.hp = b.plugin.maxhp = (MATS[it.k] || MATS.slime).hp;
    b.plugin.hurt = 0; b.plugin.dead = false;
    Composite.add(world, b);
    G.items.push(b);
    return b;
  }

  function removeItem(b, fxType) {
    if (b.plugin.dead) return;
    b.plugin.dead = true;
    G.fx.push({ t: fxType, x: b.position.x, y: b.position.y, mat: b.plugin.mat || 'slime', r: b.plugin.r || 20 });
    Composite.remove(world, b);
    const i = G.items.indexOf(b); if (i >= 0) G.items.splice(i, 1);
    if (b.plugin.kind === 'slime') G.score += 1000; else G.score += 60;
    wakeAll();
  }

  function damage(b, amount) {
    if (!b.plugin || b.plugin.hp === undefined || b.plugin.dead) return;
    b.plugin.hp -= amount;
    b.plugin.hurt = Math.min(1, 1 - b.plugin.hp / b.plugin.maxhp);
    if (b.plugin.hp <= 0) removeItem(b, b.plugin.kind === 'slime' ? 'pop' : 'break');
    else if (amount > 6) G.fx.push({ t: 'hit', x: b.position.x, y: b.position.y, mat: b.plugin.mat || 'slime' });
  }

  Events.on(engine, 'collisionStart', ev => {
    if (!G.armed) return;
    for (const p of ev.pairs) {
      const A = p.bodyA, Bb = p.bodyB;
      const va = A.velocity, vb = Bb.velocity;
      const rel = Math.hypot(va.x - vb.x, va.y - vb.y);
      if (rel < 1.6) continue;
      const mA = A.isStatic ? 1e6 : A.mass, mB = Bb.isStatic ? 1e6 : Bb.mass;
      const mred = (mA * mB) / (mA + mB);
      const dmg = (rel - 1.2) * mred * DMG_K;
      if (rel > 4) G.fx.push({ t: 'thud', v: Math.min(1, rel / 14) });
      damage(A, dmg); damage(Bb, dmg);
    }
  });

  function spawnChick() {
    const kind = G.queue.shift();
    G.chickKind = kind;
    const c = Bodies.circle(SLING.x, SLING.y, CHICK_R, { density: 0.006, friction: 0.4, restitution: 0.2, frictionAir: 0.001, label: 'chick' });
    c.plugin.kind = 'chick';
    Body.setStatic(c, true);
    Composite.add(world, c);
    G.chick = c; G.abilityUsed = false; G.flyT = 0;
    G.phase = 'aim';
  }

  G.loadLevel = function (i) {
    for (const b of G.items.slice()) Composite.remove(world, b);
    G.items.length = 0;
    if (G.chick) Composite.remove(world, G.chick);
    G.chick = null; G.fx.length = 0; G.result = null;
    G.level = i; G.score = 0; G.armed = false;
    const L = LEVELS[i];
    for (const it of L.items) addItem(it);
    G.queue = L.chicks.slice(); G.total = L.chicks.length; G.used = 0;
    // let the structure settle before it can be damaged
    for (let s = 0; s < 150; s++) Engine.update(engine, STEP_MS);
    for (const b of G.items) { Body.setVelocity(b, { x: 0, y: 0 }); Body.setAngularVelocity(b, 0); b.plugin.hp = b.plugin.maxhp; b.plugin.hurt = 0; }
    G.armed = true; G.settleT = 0; G.phase = 'idle';
    spawnChick();
  };

  G.slimesLeft = () => G.items.filter(b => b.plugin.kind === 'slime').length;

  // pull the chick back (physics coords)
  G.setPull = function (x, y) {
    if (G.phase !== 'aim' || !G.chick) return;
    let dx = x - SLING.x, dy = y - SLING.y;
    const d = Math.hypot(dx, dy);
    if (d > MAX_PULL) { dx = dx / d * MAX_PULL; dy = dy / d * MAX_PULL; }
    Body.setPosition(G.chick, { x: SLING.x + dx, y: SLING.y + dy });
  };
  G.pullVec = () => G.chick ? { x: G.chick.position.x - SLING.x, y: G.chick.position.y - SLING.y } : { x: 0, y: 0 };

  G.release = function () {
    if (G.phase !== 'aim' || !G.chick) return false;
    const p = G.pullVec(), d = Math.hypot(p.x, p.y);
    if (d < 14) { Body.setPosition(G.chick, { x: SLING.x, y: SLING.y }); return false; }
    Body.setStatic(G.chick, false);
    Body.setVelocity(G.chick, { x: -p.x * POWER, y: -p.y * POWER });
    G.used++; G.phase = 'fly'; G.flyT = 0; G.calmT = 0;
    G.fx.push({ t: 'launch' });
    return true;
  };

  G.ability = function () {
    if (G.phase !== 'fly' || !G.chick || G.abilityUsed) return;
    const c = G.chick, k = G.chickKind;
    if (k === 'b') {
      G.abilityUsed = true;
      Body.setVelocity(c, { x: c.velocity.x * 1.85, y: c.velocity.y * 1.85 });
      G.fx.push({ t: 'dash', x: c.position.x, y: c.position.y });
    } else if (k === 'p') {
      G.abilityUsed = true;
      const R = 120;
      for (const b of G.items.slice()) {
        const dx = b.position.x - c.position.x, dy = b.position.y - c.position.y;
        const d = Math.hypot(dx, dy);
        if (d < R) {
          const f = 1 - d / R;
          Sleeping.set(b, false);
          Body.setVelocity(b, { x: b.velocity.x + dx / (d || 1) * 9 * f, y: b.velocity.y + dy / (d || 1) * 9 * f - 2 * f });
          damage(b, 70 * f);
        }
      }
      G.fx.push({ t: 'burst', x: c.position.x, y: c.position.y });
      Composite.remove(world, c); G.chick = null; G.phase = 'settle'; G.settleT = 0;
    }
  };

  function maxMotion() {
    let m = 0;
    for (const b of G.items) m = Math.max(m, b.speed, Math.abs(b.angularSpeed) * 10);
    return m;
  }

  G.step = function () {
    G.tick++;
    Engine.update(engine, STEP_MS);
    // out of bounds clean-up
    for (const b of G.items.slice()) {
      if (b.position.x > 1100 || b.position.x < -300 || b.position.y > 500) removeItem(b, b.plugin.kind === 'slime' ? 'pop' : 'break');
    }
    if (G.phase === 'fly') {
      const c = G.chick; G.flyT++;
      const out = c.position.x > 1100 || c.position.x < -200 || c.position.y > 400;
      if (c.speed < 0.22) G.calmT++; else G.calmT = 0;
      if (out || G.calmT > 50 || G.flyT > 720) {
        Composite.remove(world, c); G.fx.push({ t: 'chickgone', x: c.position.x, y: c.position.y });
        G.chick = null; G.phase = 'settle'; G.settleT = 0;
      }
    } else if (G.phase === 'settle') {
      G.settleT++;
      const calm = maxMotion() < 0.25;
      if ((calm && G.settleT > 50) || G.settleT > 420) {
        if (G.slimesLeft() === 0) { G.finish(true); }
        else if (G.queue.length === 0) { G.finish(false); }
        else spawnChick();
      }
    }
    // a win can happen early (all slimes popped while chick still moving)
    if ((G.phase === 'fly' || G.phase === 'settle') && G.slimesLeft() === 0 && !G.result) {
      G.winT = (G.winT || 0) + 1;
      if (G.winT > 70) G.finish(true);
    } else G.winT = 0;
  };

  G.finish = function (won) {
    if (G.result) return;
    if (G.chick) { Composite.remove(world, G.chick); G.chick = null; }
    const left = G.queue.length;
    const stars = won ? (left >= 2 ? 3 : left === 1 ? 2 : 1) : 0;
    if (won) G.score += left * 800;
    G.result = { won, stars, left, score: G.score };
    G.phase = 'done';
  };

  return G;
}

if (typeof module !== 'undefined') module.exports = { createGame, LEVELS, SLING, MAX_PULL, POWER, MATS, GRAV_STEP, CHICK_R, WORLD_W };

</script>
<script>
(function () {
'use strict';
const G = createGame(Matter);
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const store = (() => {
  const K = 'chickfling_v1';
  let d = { stars: {}, best: {}, mute: false };
  try { d = Object.assign(d, JSON.parse(localStorage.getItem(K) || '{}')); } catch (e) {}
  return { d, save() { try { localStorage.setItem(K, JSON.stringify(d)); } catch (e) {} } };
})();

/* ---------- layout ---------- */
let scale = 1, ox = 0, dpr = 1, VH = 600, GY = 540, CW = 360, CH = 600;
function resize() {
  const st = $('stage'); CW = st.clientWidth; CH = st.clientHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(CW * dpr); cv.height = Math.round(CH * dpr);
  cv.style.width = CW + 'px'; cv.style.height = CH + 'px';
  scale = Math.min(CW / WORLD_W, CH / 340);
  VH = CH / scale; ox = (CW / scale - WORLD_W) / 2; GY = VH - 56;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));

/* ---------- audio ---------- */
let AC = null, master = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = store.d.mute ? 0 : 0.5; master.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC) return; const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol || .3, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);

function toPhys(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale - ox, y: (e.clientY - r.top) / scale - GY }; }
cv.addEventListener('pointerdown', e => {
  audioInit(); if (menuOpen()) return;
  e.preventDefault();
  const p = toPhys(e);
  if (G.phase === 'aim' && G.chick) {
    if (Math.hypot(p.x - SLING.x, p.y - SLING.y) < 90) { pulling = true; cv.setPointerCapture && cv.setPointerCapture(e.pointerId); G.setPull(p.x, p.y); }
  } else if (G.phase === 'fly') G.ability();
});
cv.addEventListener('pointermove', e => { if (!pulling) return; e.preventDefault(); const p = toPhys(e); G.setPull(p.x, p.y); });
function endPull(e) { if (!pulling) return; pulling = false; G.release(); updateHud(); }
cv.addEventListener('pointerup', endPull); cv.addEventListener('pointercancel', endPull);
window.addEventListener('keydown', e => { if (e.code === 'Space') { audioInit(); G.ability(); e.preventDefault(); } });

/* ---------- UI flow ---------- */
function menuOpen() { return $('ovMenu').classList.contains('show') || $('ovEnd').classList.contains('show'); }
function updateHud() {
  $('score').textContent = G.score.toLocaleString();
  $('lvl').innerHTML = `Level ${G.level + 1}<small>${LEVELS[G.level].name}</small>`;
}
function buildMenu() {
  const g = $('lgrid'); g.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const s = store.d.stars[i] || 0;
    const b = document.createElement('button'); b.className = 'lbtn';
    b.innerHTML = `<b>${i + 1}</b><i>${L.name}</i><em>${[1, 2, 3].map(n => `<span class="${n <= s ? 'on' : ''}">★</span>`).join('')}</em>`;
    b.onclick = () => { audioInit(); startLevel(i); };
    g.appendChild(b);
  });
}
function startLevel(i) {
  $('ovMenu').classList.remove('show'); $('ovEnd').classList.remove('show');
  G.loadLevel(i); P.length = 0; floats.length = 0; rings.length = 0; endShown = false; updateHud();
}
$('rst').onclick = () => { audioInit(); startLevel(G.level); };
$('menu').onclick = () => { audioInit(); buildMenu(); $('ovEnd').classList.remove('show'); $('ovMenu').classList.add('show'); };

let endShown = false, endTimer = 0;
function showEnd() {
  const r = G.result; endShown = true;
  if (r.won) {
    const prev = store.d.stars[G.level] || 0; if (r.stars > prev) store.d.stars[G.level] = r.stars;
    if (r.score > (store.d.best[G.level] || 0)) store.d.best[G.level] = r.score;
    store.save(); SFX.win();
  } else SFX.lose();
  $('endTitle').textContent = r.won ? (G.level === LEVELS.length - 1 ? '🎉 You Did It!' : 'Level Clear!') : 'So close!';
  $('endStars').innerHTML = r.won ? [1, 2, 3].map(n => `<span class="${n <= r.stars ? 'on' : ''}">★</span>`).join('') : '😅';
  $('endScore').textContent = r.won ? `Score ${r.score.toLocaleString()}` + (store.d.best[G.level] === r.score ? '  ·  New best!' : '') : 'Pop all the slimes to win!';
  const btns = $('endBtns'); btns.innerHTML = '';
  const add = (txt, cls, fn) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = txt; b.onclick = () => { audioInit(); fn(); }; btns.appendChild(b); };
  if (r.won && G.level < LEVELS.length - 1) add('Next ▶', '', () => startLevel(G.level + 1));
  add('Retry ↻', r.won ? 'alt' : '', () => startLevel(G.level));
  add('Levels', 'alt', () => { buildMenu(); $('ovEnd').classList.remove('show'); $('ovMenu').classList.add('show'); });
  $('ovEnd').classList.add('show');
}

/* ---------- main loop ---------- */
let last = performance.now(), acc = 0, T = 0;
function frame(now) {
  const dt = Math.min(100, now - last); last = now; T += dt / 1000;
  if (!document.hidden && !menuOpen()) {
    acc += dt; let n = 0;
    while (acc >= STEP_MS && n < 5) { G.step(); acc -= STEP_MS; n++; }
    if (n === 5) acc = 0;
  } else acc = 0;
  handleFx();
  // particles
  for (let i = P.length - 1; i >= 0; i--) { const p = P[i]; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.vr; if (--p.life <= 0) P.splice(i, 1); }
  for (let i = floats.length - 1; i >= 0; i--) if (++floats[i].t > 50) floats.splice(i, 1);
  for (let i = rings.length - 1; i >= 0; i--) if (++rings[i].t > 20) rings.splice(i, 1);
  shake *= .88;
  if (G.result && !endShown) { endTimer += dt; if (endTimer > 900) { endTimer = 0; showEnd(); } } else if (!G.result) endTimer = 0;
  $('score').textContent = G.score.toLocaleString();
  render(T);
  requestAnimationFrame(frame);
}

resize(); buildMenu(); G.loadLevel(0); updateHud();
requestAnimationFrame(frame);
window.__chick = { G, startLevel, store };   // handy for debugging
})();
</script>
